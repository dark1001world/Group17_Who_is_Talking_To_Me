data:
  audio_dir: "/DATA/G17/Data/wave/"
  frames_dir: "/DATA/G17/Data/video/"
  annotation_dir: "/DATA/G17/ego4d_data/v2/annotations/"
  annotation_file: "/DATA/G17/ego4d_data/v2/ttm_train.json"
  output_dir: "/DATA/G17/processed_features/"
  sample_rate: 16000
  video_fps: 30

alignment:
  stride: 0.2
  window_size: 0.2
  video_fps: 30

extraction:
  frame_tolerance: 3
  min_valid_tracks: 1
  min_valid_frames_per_track: 3
  require_positive_labels: true
  save_debug_arrays: true
  max_visual_errors_per_clip: 5
  max_visual_errors_total: 25

benchmark:
  video_dir: "/DATA/G17/Data/video/"
  audio_dir: "/DATA/G17/Data/wave/"
  tracklet_dir: "/DATA/G17/Group17_Who_is_Talking_To_Me/starter_code/data/json_original/"
  ttm_dir: "/DATA/G17/Group17_Who_is_Talking_To_Me/starter_code/data/result_TTM/"
  train_split: "/DATA/G17/Group17_Who_is_Talking_To_Me/starter_code/data/split/train.list"
  val_split: "/DATA/G17/Group17_Who_is_Talking_To_Me/starter_code/data/split/val.list"
  fps: 30
  sample_rate: 16000
  crop_size: 224
  min_frames: 15
  max_frames: 150
  frame_step: 1
  min_valid_face_frames: 3
  filter_missing_tracks: true

visual:
  vit_model: "google/vit-base-patch16-224"
  face_size: 224
  reid_model: "vggface2"
  lip_window_frames: 5
  lip_feature_dim: 128
  reid_feature_dim: 512
  proj_vit_dim: 256
  proj_reid_dim: 256
  proj_lip_dim: 128

audio:
  model_name: "facebook/wav2vec2-base-960h"

fusion:
  fusion_dim: 512
  num_heads: 8
  num_temporal_layers: 2
  dropout: 0.1

training:
  batch_size: 8
  epochs: 20
  learning_rate: 0.0001
  device: "cuda"
  pos_weight: 2.0
  focal_loss:
    alpha: 0.25
    gamma: 2.0
  lambda_smooth: 0.1
  lambda_sync: 0.05
  pos_frame_window: 5

benchmark_model:
  hidden_dim: 256
  num_layers: 2
  dropout: 0.1

tracking:
  iou_threshold: 0.3
  max_lost: 30
  min_track_length: 10

label_matching:
  iou_threshold: 0.5
  reid_threshold: 0.7
  use_reid: true
  use_iou: true
  cost_threshold_percentile: 25

logging:
  level: "INFO"
  log_dir: "/DATA/G17/logs/"
